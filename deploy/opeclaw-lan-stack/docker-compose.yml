services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL}
      - --served-model-name
      - ${SERVED_MODEL_NAME}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${MAX_MODEL_LEN}
      - --max-num-seqs
      - ${MAX_NUM_SEQS}
      - --download-dir
      - /models
      - --dtype
      - ${VLLM_DTYPE}
      - --api-key
      - ${INTERNAL_OPENAI_KEY}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
    volumes:
      - /mnt/modelos:/models
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  opeclaw:
    image: ${OPECLAW_IMAGE}
    container_name: opeclaw
    restart: unless-stopped
    environment:
      OPENAI_API_BASE: http://vllm:8000/v1
      OPENAI_API_KEY: ${INTERNAL_OPENAI_KEY}
      OPECLAW_PORT: 8080
      TZ: ${TZ}
    expose:
      - "8080"
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || curl -fsS http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s

  proxy:
    image: nginx:1.27-alpine
    container_name: opeclaw-proxy
    restart: unless-stopped
    depends_on:
      opeclaw:
        condition: service_started
      vllm:
        condition: service_healthy
    ports:
      - "${HOST_BIND_IP}:8080:8080"
      - "${HOST_BIND_IP}:7000:7000"
      - "${HOST_BIND_IP}:19090:19090"
    environment:
      REQUIRE_AUTH: ${REQUIRE_AUTH}
      BEARER_TOKEN: ${BEARER_TOKEN}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM}
      INTERNAL_OPENAI_KEY: ${INTERNAL_OPENAI_KEY}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    command:
      - /bin/sh
      - -c
      - envsubst '$$REQUIRE_AUTH $$BEARER_TOKEN $$RATE_LIMIT_RPM $$INTERNAL_OPENAI_KEY' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19090/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  hf-cache:
