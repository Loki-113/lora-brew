limit_req_zone $binary_remote_addr zone=api_limit:10m rate=${RATE_LIMIT_RPM}r/m;

map "$REQUIRE_AUTH:$http_authorization" $auth_ok {
    default 0;
    ~^0: 1;
    "1:Bearer ${BEARER_TOKEN}" 1;
}

server {
    listen 8080;
    server_name _;

    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        if ($auth_ok = 0) {
            return 401;
        }
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://opeclaw:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }
}

server {
    listen 7000;
    server_name _;

    location / {
        if ($auth_ok = 0) {
            return 401;
        }
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://vllm:8000;
        proxy_set_header Authorization "Bearer ${INTERNAL_OPENAI_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }
}

server {
    listen 19090;
    server_name _;

    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
